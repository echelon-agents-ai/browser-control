<!doctype html>
<html><head><title>Hit-test fixture</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; background: #fff; }
  #plainBtn { position: absolute; left: 40px; top: 40px; width: 160px; height: 50px; }
  /* (a) a transparent, full-viewport overlay sitting above #plainBtn */
  #overlay { position: fixed; inset: 0; background: transparent; }
  #overlay.off { display: none; }
  /* (b) an inner scroll container, scrolled, with a button below the fold */
  #scrollBox { position: absolute; left: 40px; top: 140px; width: 300px; height: 100px; overflow: auto; border: 1px solid #999; }
  #scrollInner { height: 500px; position: relative; }
  #scrollBtn { position: absolute; left: 20px; top: 300px; width: 140px; height: 40px; }
  /* (c) a combobox */
  #combo { position: absolute; left: 40px; top: 280px; width: 200px; height: 36px; }
</style></head>
<body>
<button id="plainBtn">Plain button</button>
<div id="overlay" class="off"></div>
<div id="scrollBox"><div id="scrollInner"><button id="scrollBtn">Scrolled button</button></div></div>
<button id="combo" role="combobox" aria-expanded="false" aria-haspopup="listbox">Choose one</button>
<script>
  window.__log = [];
  const log = (e) => window.__log.push(e);
  document.getElementById('plainBtn').addEventListener('click', (e) => log({ ev: 'click', id: 'plainBtn', trusted: e.isTrusted }));
  document.getElementById('scrollBtn').addEventListener('click', (e) => log({ ev: 'click', id: 'scrollBtn', trusted: e.isTrusted }));
  const combo = document.getElementById('combo');
  combo.addEventListener('click', () => {
    const open = combo.getAttribute('aria-expanded') === 'true';
    combo.setAttribute('aria-expanded', open ? 'false' : 'true');
    log({ ev: 'click', id: 'combo', trusted: true });
  });
  // scroll the inner container so the button sits below the fold within it
  document.getElementById('scrollBox').scrollTop = 260;
</script>
</body></html>
