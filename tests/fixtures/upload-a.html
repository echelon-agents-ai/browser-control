<!doctype html>
<html><head><title>Upload A</title></head>
<body>
<!-- Slack-like: a hidden input the AX tree may not expose, next to a visible button that
     programmatically clicks it (a trusted click on the button delegates user-activation, so the
     real native file chooser opens). -->
<input id="file" type="file" multiple aria-label="Upload" style="display:none">
<button id="attach">Attach files</button>
<span id="out"></span>
<script>
  document.getElementById('attach').addEventListener('click', () => document.getElementById('file').click());
  document.getElementById('file').addEventListener('change', (e) => {
    const names = Array.from(e.target.files).map((f) => f.name + ':' + f.size).join(',');
    document.getElementById('out').textContent = 'change:' + names;
  });
</script>
</body></html>
